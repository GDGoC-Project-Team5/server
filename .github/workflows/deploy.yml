name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (저장소의 prod 파일을 포함함)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버의 임시 폴더로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/tobe"
          strip_components: 2

      # 4. 서버 내 배포 및 실행 스크립트
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PATH="/usr/share/nginx/server"
            
            # 1. 폴더 준비 및 파일 이동
            sudo mkdir -p $APP_PATH/current
            sudo find /home/ubuntu/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} $APP_PATH/current/project.jar \;
            
            # 2. 기존 프로세스 종료 (8080 포트 정조준)
            sudo fuser -k 8080/tcp || true
            sleep 3
            
            # 3. 배포 및 실행 (JAR 내부의 prod 프로필 활성화)
            cd $APP_PATH/current
            sudo bash -c "nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &"
            
            disown || true
            sleep 10
            
            # 4. 최종 확인
            if sudo lsof -Pi :8080 -sTCP:LISTEN -t >/dev/null ; then
              echo "✅ 배포 성공! 서버가 8080 포트에서 동작 중입니다."
              rm -rf /home/ubuntu/tobe
            else
              echo "❌ 배포 실패! 로그를 확인하세요."
              sudo cat ./output.log
              exit 1
            fi