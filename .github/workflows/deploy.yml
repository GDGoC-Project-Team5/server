name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (저장소의 prod 파일을 포함함)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버의 임시 폴더로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/tobe"
          strip_components: 2

      # 4. 서버 내 배포 및 실행 스크립트
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # 1. GitHub Runner 레벨에서 환경 변수 선언
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 2. 선언된 환경 변수를 SSH 세션 내부로 전달
          envs: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
          script: |
            APP_PATH="/usr/share/nginx/server"

            sudo mkdir -p $APP_PATH/current
            sudo find /home/ubuntu/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} $APP_PATH/current/project.jar \;

            sudo fuser -k 8080/tcp || true

            cd $APP_PATH/current

            # 3. 전달받은 변수 사용 (쉘 변수 문법 $변수명 사용)
            sudo nohup java -jar \
              -Dspring.profiles.active=prod \
              -Dspring.security.oauth2.client.registration.google.client-id=$GOOGLE_CLIENT_ID \
              -Dspring.security.oauth2.client.registration.google.client-secret=$GOOGLE_CLIENT_SECRET \
              project.jar > ./output.log 2>&1 &

            sleep 2
            exit 0