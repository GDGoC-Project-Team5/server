name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 실행 가능한 JAR 파일 하나만 골라서 app.jar로 이동 (plain.jar 제외)
            find /usr/share/nginx/server/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} /usr/share/nginx/server/app.jar \;
            
            # 2. 기존 실행 중인 Java 프로세스 종료
            PID=$(pgrep -f app.jar)
            if [ -n "$PID" ]; then
            echo "기존 프로세스(PID: $PID)를 종료합니다..."
            kill -15 $PID
            sleep 5
            
            # 5초 뒤에도 프로세스가 살아있다면 강제 종료
            if ps -p $PID > /dev/null; then
            echo "프로세스가 종료되지 않아 강제 종료(-9)합니다."
            kill -9 $PID
            fi
            fi
            
            # 3. 새 버전 실행 (prod 프로필)
            cd /usr/share/nginx/server
            # 이전에 남은 임시 파일들 정리
            rm -rf /usr/share/nginx/server/tobe/*
            
            nohup java -jar -Dspring.profiles.active=prod app.jar > nohup.out 2>&1 &
            echo "새 버전 배포 완료!"