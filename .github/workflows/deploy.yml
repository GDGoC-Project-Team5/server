name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 기존 폴더 정리 및 이동
            sudo rm -rf /usr/share/nginx/current
            sudo mkdir -p /usr/share/nginx/current
            sudo mv /usr/share/nginx/tobe/project.jar /usr/share/nginx/current/project.jar

            # 2. 포트 점유 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 2

            # 3. 실행
            cd /usr/share/nginx/current
            sudo nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &

            # 4. 세션 독립 (GitHub Actions가 바로 종료될 수 있게 함)
            disown

            # 5. 임시 파일 삭제
            sudo rm -rf /usr/share/nginx/tobe