name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 (SSH만 사용)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PATH="/usr/share/nginx/server"
            
            # 1. 소스 업데이트
            cd $APP_PATH
            sudo chown -R ubuntu:ubuntu .  # 권한 확인
            git pull origin main

            # 2. 서버 내부에서 빌드 (Swap 메모리 설정 필수!)
            echo "🔨 서버 내 빌드 시작..."
            ./gradlew clean build -x test

            # 3. 기존 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 5

            # 4. 실행 파일 준비 및 실행
            sudo mkdir -p ./current
            sudo find ./build/libs -name "*.jar" ! -name "*-plain.jar" -exec cp {} ./current/project.jar \;
            
            cd ./current
            # JAR 옆에 application-prod.yml이 이미 있다고 가정
            sudo bash -c "nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &"
            
            disown || true
            sleep 10
            
            # 5. 확인
            if sudo lsof -Pi :8080 -sTCP:LISTEN -t >/dev/null ; then
              echo "✅ 서버 내 빌드 및 배포 성공!"
            else
              echo "❌ 배포 실패! 로그 확인: $APP_PATH/current/output.log"
              sudo cat ./output.log
              exit 1
            fi