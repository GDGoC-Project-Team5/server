name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 경로 및 파일 준비 (sudo를 각 명령어에 붙임)
            sudo mkdir -p /usr/share/nginx/current
            sudo mv /usr/share/nginx/tobe/project.jar /usr/share/nginx/current/project.jar || true

            # 2. 기존 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 3

            # 3. 실행 (핵심: 입출력을 완벽히 차단하여 세션 독립)
            cd /usr/share/nginx/current
            sudo nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 < /dev/null &

            # 4. 쉘 독립 및 잠시 대기
            disown
            sleep 10

            # 5. 배포 확인 로직 (이게 있어야 진짜 성공/실패를 알 수 있음)
            if pgrep -f project.jar > /dev/null; then
              echo "✅ [SUCCESS] 스프링 부트가 정상적으로 실행 중입니다."
              sudo rm -rf /usr/share/nginx/tobe
              exit 0
            else
              echo "❌ [FAIL] 스프링 부트 실행에 실패했습니다. 로그를 확인하세요."
              cat ./output.log
              exit 1
            fi