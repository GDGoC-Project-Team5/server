name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 환경 설정 (경로를 하나로 고정하세요)
            APP_PATH="/usr/share/nginx/server"
            
            # 2. 전송된 파일이 있는지 확인 (없으면 여기서 중단됨)
            if [ ! -d "$APP_PATH/tobe" ]; then
              echo "❌ 에러: $APP_PATH/tobe 폴더가 없습니다. SCP 전송 경로를 확인하세요."
              exit 1
            fi
            
            # 3. 기존 프로세스 확실히 종료 (포트를 사용하는 녀석을 정조준)
            echo "기존 프로세스 종료 중..."
            sudo fuser -k 8080/tcp || true
            sleep 5
            
            # 4. 파일 교체
            sudo mkdir -p $APP_PATH/current
            # 기존 JAR가 있다면 백업하거나 삭제하여 꼬임 방지
            sudo rm -f $APP_PATH/current/project.jar
            
            echo "파일 이동 중..."
            sudo find $APP_PATH/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} $APP_PATH/current/project.jar \;
            
            # 5. 실행
            cd $APP_PATH/current
            echo "스프링 부트 실행 중..."
            sudo bash -c "nohup java -jar -Dspring.profiles.active=prod -Dspring.config.location=file:/usr/share/nginx/server/application-prod.yml project.jar > ./output.log 2>&1 &"            
            
            # 6. 세션 독립 및 확인을 위한 대기
            disown || true
            sleep 15
            
            # 7. 진짜로 떴는지 확인 (8080 포트가 살아있는지 체크하는 게 가장 정확합니다)
            if sudo lsof -Pi :8080 -sTCP:LISTEN -t >/dev/null ; then
              echo "✅ [SUCCESS] 8080 포트가 활성화되었습니다. 배포 완료!"
              sudo rm -rf $APP_PATH/tobe/*
              exit 0
            else
              echo "❌ [FAIL] 배포 후 8080 포트가 응답하지 않습니다. 로그를 출력합니다."
              sudo cat ./output.log
              exit 1
            fi