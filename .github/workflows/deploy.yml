name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 파일 이동 (이름에 상관없이 .jar 파일을 찾아 project.jar로 변경)
            # -plain.jar는 제외하고 가장 최근의 jar 파일을 옮깁니다.
            sudo mkdir -p /usr/share/nginx/current
            sudo find /usr/share/nginx/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} /usr/share/nginx/current/project.jar \;

            # 2. 기존 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 3

            # 3. 실행 (sudo bash -c를 사용해야 > 리디렉션 권한 에러가 안 납니다)
            cd /usr/share/nginx/current
            sudo bash -c "nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &"

            # 4. 세션 독립 및 확인
            disown
            sleep 10

            if pgrep -f project.jar > /dev/null; then
              echo "✅ 배포 성공: 스프링 부트가 실행 중입니다."
              sudo rm -rf /usr/share/nginx/tobe/*
              exit 0
            else
              echo "❌ 배포 실패: 아래 로그를 확인하세요."
              sudo cat /usr/share/nginx/current/output.log
              exit 1
            fi