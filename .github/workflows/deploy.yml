name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (저장소의 prod 파일을 포함함)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버의 임시 폴더로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/tobe"
          strip_components: 2

      # 4. 서버 내 배포 및 실행 스크립트
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PATH="/usr/share/nginx/server"
            
            # 1. 파일 이동
            sudo mkdir -p $APP_PATH/current
            sudo find /home/ubuntu/tobe -name "*.jar" ! -name "*-plain.jar" -exec mv {} $APP_PATH/current/project.jar \;
            
            # 2. 기존 프로세스 종료 (실패해도 무시)
            sudo fuser -k 8080/tcp || true
            
            # 3. 실행 (백그라운드 실행 후 세션 분리)
            cd $APP_PATH/current
            sudo nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &
            
            # 4. 깃허브 액션에게 "성공했다"고 확실히 말해주기
            sleep 2
            exit 0