name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 설정 (프로젝트 버전에 맞춰 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 3. JAR 파일을 서버로 전송 (SCP)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/usr/share/nginx/server/tobe" # 임시 폴더로 전송
          strip_components: 2

      # 4. 서버에서 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PATH="/usr/share/nginx/server"
            cd $APP_PATH
            
            # 1. 소스 코드 업데이트
            echo "🚚 Git Pull 진행 중..."
            git pull origin main
            
            # 2. 서버 내부 빌드 (테스트 제외하여 메모리 아끼기)
            echo "🔨 빌드 시작 (t3.small 환경)..."
            ./gradlew clean build -x test
            
            # 3. 기존 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 5
            
            # 4. 새 버전 실행 (빌드된 경로에서 바로 실행)
            echo "🚀 애플리케이션 실행 중..."
            # 빌드된 최신 jar를 current 폴더로 복사 (이름 고정)
            sudo mkdir -p ./current
            sudo find ./build/libs -name "*.jar" ! -name "*-plain.jar" -exec cp {} ./current/project.jar \;
            
            cd ./current
            # 설정 파일은 APP_PATH 상위에 있다고 가정 (파일명 확인 필수)
            sudo bash -c "nohup java -jar -Dspring.profiles.active=prod project.jar > ./output.log 2>&1 &"
            
            disown || true
            sleep 10
            
            # 5. 상태 확인
            if sudo lsof -Pi :8080 -sTCP:LISTEN -t >/dev/null ; then
              echo "✅ 배포 완료! 서버가 정상 동작합니다."
            else
              echo "❌ 배포 실패! 로그를 확인하세요."
              sudo cat ./output.log
              exit 1
            fi