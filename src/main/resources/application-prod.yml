spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gdg_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: admin
    password: "tiger1234!"
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always  # data-skill.sql 항상 실행
      data-locations: classpath:data-skill.sql

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

jwt:
  secret: VGhpcyBpcyBhIHZlcnkgc2ChOoJlIHNlY3JldCBrZXkgZm9yIEpXVCAoMzJiYnl0ZXMpIQ==  # 예시 비밀 키 (Base64 인코딩된 문자열)
  accessExpiration: 3600000                 # 1시간 (3600000 밀리초)
  refreshExpiration: 604800000                     # 7일 (604800000 밀리초)

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/home/ubuntu/uploads}
    url-prefix: /files

